name: Build attack module APKs

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Stage APK Artifacts
        run: |
          mkdir -p artifact-apks
          cp */build/outputs/apk/debug/*.apk artifact-apks/
      
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: module-apks
          path: artifact-apks/*.apk
          if-no-files-found: error
